# Webserv Demo Configuration File
# This file demonstrates multiple server blocks with various configurations

# Server 1: Main website on port 8080
server {
    listen 8080;
    server_name example.com;
    host 127.0.0.1;
    root www/site1;
    client_max_body_size 10M;
    index index.html;
    error_page 404 /errors/404.html;

    location / {
        allow_methods GET POST;
        autoindex off;
    }

    location /uploads {
        allow_methods GET POST DELETE;
        autoindex on;
        upload_path /var/www/uploads;
    }

    location /api {
        allow_methods GET POST PUT DELETE;
        autoindex off;
    }
}

# Server 2: CGI-enabled server on port 8081
server {
    listen 8081;
    server_name cgi.example.com;
    host 127.0.0.1;
    root www/site2;
    client_max_body_size 5M;
    index index.html;

    location / {
        allow_methods GET;
        autoindex on;
    }

    location /cgi-bin {
        root ./;
        allow_methods GET POST;
        index script.py;
        cgi_path /usr/bin/python3 /bin/bash;
        cgi_ext .py .sh;
    }

    location /scripts {
        root ./cgi-bin;
        allow_methods GET POST DELETE;
        cgi_path /usr/bin/python3;
        cgi_ext .py;
    }
}

# Server 3: Redirect server on port 8082
server {
    listen 8082;
    server_name redirect.example.com;
    host 127.0.0.1;
    root www/site1;
    index index.html;

    location / {
        allow_methods GET;
        autoindex off;
    }

    location /old-page {
        return /new-page;
    }

    location /external {
        return https://example.com;
    }
}

# Server 4: File upload server on port 8083
server {
    listen 8083;
    server_name upload.example.com;
    host 0.0.0.0;
    root www/uploads;
    client_max_body_size 100M;
    index index.html;
    error_page 413 /errors/too_large.html;

    location / {
        allow_methods GET POST DELETE;
        autoindex on;
    }

    location /files {
        allow_methods GET POST DELETE PUT;
        autoindex on;
        upload_path ./uploads/files;
    }

    location /images {
        allow_methods GET POST DELETE;
        autoindex on;
        upload_path ./uploads/images;
    }
}

# Server 5: Static file server with directory listing
server {
    listen 8084;
    server_name static.example.com;
    host 127.0.0.1;
    root www/static;
    client_max_body_size 1M;
    index index.html index.htm;

    location / {
        allow_methods GET HEAD;
        autoindex on;
    }

    location /downloads {
        allow_methods GET HEAD;
        autoindex on;
    }

    location /docs {
        allow_methods GET;
        autoindex off;
        index readme.html;
    }
}
