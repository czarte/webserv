server {
    listen 8080;
    session on;
    server_name localhost;
    host 127.0.0.1;
    root www/site1;
    client_max_body_size 1M;
    index index.html;
    error_page 404 errors/404.html;

    location / {
        allow_methods GET POST PUT DELETE;
        autoindex on;
    }

    # location /cgi {
    #     allow_methods GET POST PUT DELETE;
    #     cgi_path /usr/bin/php-cgi;
    #     cgi_ext .php;
    #     root www/site1  ;
    #     alias cgi-bin;
    #     cgi on;
    # }
    location /cgi {
        cgi php /usr/bin/php-cgi;
        cgi_ext .php;
        cgi on;
        root www/site1;
        alias cgi-bin;
    }

    location /uploads {
        root www/site1;
        allow_methods GET POST PUT DELETE;
        autoindex on;
        # upload_path www/uploads;
    }
}

